name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Run Test Suite
        run: yarn test

      - name: Check config.schema.json is up to date
        run: yarn schema && git diff --exit-code -- config.schema.json

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Make repo writable for BuildKit
        run: sudo chmod -R 777 "$GITHUB_WORKSPACE/.yarn"

      # Builds the Dockerfile and pushes ghcr.io/tomerh2001/israeli-banks-simplefin-bridge
      # tagged latest, <version> and <major>-latest (see .releaserc).
      - name: Semantic Release
        run: yarn semantic-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.server_url }}/${{ github.repository }}
          DOCKER_REGISTRY_USER: ${{ github.actor }}
          DOCKER_REGISTRY_PASSWORD: ${{ github.token }}
